apiVersion: platform/v1
kind: EnvironmentTemplate
metadata:
  name: payment-gateway
  version: 1.0.0
  displayName: Payment gateway
  description: >
    Payment API behind TLS ingress, an idempotency cache, a FIFO queue for payment events with a
    dead letter queue, a webhook dispatcher and a highly available database with long backup
    retention. Everything sits on a private network with NAT egress. A starting point for PCI DSS
    scope reduction; it is not a certified environment.
  profile: growth
spec:
  plans: [GROWTH, SCALE]
  placements:
    - name: primary
      providers: [aws, azure, gcp, oci, mock]
  variables:
    - name: apiReplicas
      type: number
      default: 2
      min: 2
      max: 6
      target: payments-api.replicas
  resources:
    - id: network
      type: network
      availabilityZones: 3
      natGateway: true
    - id: payments-api
      type: compute.container-service
      image: catalog://sample-api
      replicas: 2
      cpu: 1
      memoryMiB: 2048
      port: 8080
      public: true
      healthCheckPath: /health
      autoscaling: { minReplicas: 2, maxReplicas: 6, targetCpuPercent: 55 }
    - id: webhook-dispatcher
      type: compute.container-service
      image: catalog://sample-worker
      replicas: 2
      cpu: 0.5
      memoryMiB: 1024
    - id: ledger
      type: database.postgresql
      size: large
      storageGiB: 200
      highAvailability: zone-redundant
      backup: { enabled: true, retentionDays: 14, recoveryPointObjectiveMinutes: 5 }
    - id: idempotency
      type: cache.redis
      size: small
      replicas: 1
      critical: true
    - id: payment-events
      type: queue
      fifo: true
      deadLetter: true
      critical: true
    - id: receipts
      type: object-storage
      versioning: true
      retentionDays: 2555
    - id: ingress
      type: ingress
      routes:
        - service: payments-api
      tls: true
    - id: dns
      type: dns
      target: ingress
      customDomain: required
  connectivity:
    - { from: payments-api, to: ledger, protocol: postgres, port: 5432, mode: private-required }
    - { from: payments-api, to: idempotency, protocol: redis, port: 6379, mode: private-required }
    - { from: payments-api, to: payment-events, protocol: https, mode: private-preferred }
    - { from: webhook-dispatcher, to: payment-events, protocol: https, mode: private-preferred }
    - { from: webhook-dispatcher, to: ledger, protocol: postgres, port: 5432, mode: private-required }
    - { from: payments-api, to: receipts, protocol: https, mode: secure }
  observability:
    logs: true
    metrics: true
    traces: true
    uptime: true
    alerts: true
