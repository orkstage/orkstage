apiVersion: platform/v1
kind: EnvironmentTemplate
metadata:
  name: growth-standard
  version: 1.1.0
  displayName: Growth standard
  description: Higher resilience and performance — multiple replicas, autoscaling, zone-redundant database.
  tags: [growth]
spec:
  placements:
    - name: primary
      # AWS only: Azure and Google Cloud offer no registry, queue or DNS through OrkStage yet, and no
      # multi zone network. The portable-starter template runs on every infrastructure provider.
      providers: [aws, mock]
  resources:
    - id: network
      type: network
      availabilityZones: 3
      natGateway: true
    - id: registry
      type: container-registry
    - id: api
      type: compute.container-service
      image: catalog://sample-api
      replicas: 2
      cpu: 1
      memoryMiB: 2048
      port: 8080
      public: true
      healthCheckPath: /health
      autoscaling: { minReplicas: 2, maxReplicas: 4, targetCpuPercent: 60 }
    - id: worker
      type: compute.container-service
      image: catalog://sample-worker
      replicas: 2
      cpu: 0.5
      memoryMiB: 1024
      critical: false
    - id: database
      type: database.postgresql
      size: medium
      storageGiB: 100
      highAvailability: zone-redundant
      backup:
        enabled: true
        retentionDays: 14
    - id: cache
      type: cache.redis
      size: small
      replicas: 1
    - id: messaging
      type: queue
    - id: storage
      type: object-storage
      versioning: true
    - id: ingress
      type: ingress
      routes:
        - service: api
    - id: dns
      type: dns
      target: ingress
      customDomain: optional
  connectivity:
    - { from: api, to: database, protocol: postgres, port: 5432, mode: private-required }
    - { from: worker, to: database, protocol: postgres, port: 5432, mode: private-required }
    - { from: api, to: cache, protocol: redis, port: 6379, mode: private-required }
    - { from: api, to: messaging, protocol: https, mode: secure }
    - { from: worker, to: messaging, protocol: https, mode: secure }
    - { from: api, to: storage, protocol: https, mode: secure }
  observability:
    logs: true
    metrics: true
    traces: true
    uptime: true
    alerts: true
