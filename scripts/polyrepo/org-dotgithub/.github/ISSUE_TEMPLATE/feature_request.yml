name: Feature request
description: Propose a capability OrkStage does not have yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/orkstage/orkstage/blob/main/docs/ROADMAP.md) first: it lists known gaps.
        For early ideas that need discussion, [start a discussion](https://github.com/orgs/orkstage/discussions) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Control API or worker (orkstage)
        - Console (orkstage-console)
        - CLI or scan engine (orkstage-cli)
        - OpenTofu modules or runner image (orkstage-modules)
        - Website or documentation (orkstage-site)
        - Local stack (orkstage-dev, Docker Compose)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
      placeholder: We run one environment per customer and need to place the database in the customer's own Azure subscription.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Templates, CLI commands or API calls are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
