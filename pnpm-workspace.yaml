packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Install-time telemetry (via swagger-ui-dist): not needed, not allowed.
  '@scarf/scarf': false
  # Optional native accelerator for BullMQ's msgpack; prebuilt fallback is fine.
  msgpackr-extract: false

# Supply chain: ignore package versions published less than a day ago (minutes).
minimumReleaseAge: 1440

# Security floors for transitive dependencies of the Prisma CLI (GHSA-ggr8-5vv4-36mx,
# GHSA-3f6p-5ww8-9rcr). Remove once Prisma ships them.
overrides:
  # One Fastify for the API and @nestjs/platform-fastify (which pins an exact patch release), or
  # the plugin types of the two copies do not match.
  fastify: 5.12.8
  # CVE-2026-121707 (ReDoS in Schema.TemplateLiteral), through prisma > @prisma/config.
  effect: '^3.22.1'
  # GHSA for launch-editor in vite 8.3.0 to 8.3.2 (Windows path check bypass), through vitest.
  vite: '^8.3.3'
  deepmerge-ts: '^8.0.2'
  mysql2: '^3.22.0'
