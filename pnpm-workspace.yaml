packages:
  - apps/*
  - packages/*
  # @orkstage/scan: the Rust scan engine built to WebAssembly (committed; see cli/README.md).
  - cli/dist/scan-wasm
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Install-time telemetry (via swagger-ui-dist): not needed, not allowed.
  '@scarf/scarf': false
  # Optional native accelerator for BullMQ's msgpack; prebuilt fallback is fine.
  msgpackr-extract: false

# Supply chain: ignore package versions published less than a day ago (minutes).
minimumReleaseAge: 1440
