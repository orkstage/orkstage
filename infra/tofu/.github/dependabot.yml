version: 2
updates:
  # Provider constraints in every module (modules/<cloud>/<kind>/versions.tf).
  - package-ecosystem: terraform
    directories:
      - /modules/*/*
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # OpenTofu and Alpine base images of the runner image.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
