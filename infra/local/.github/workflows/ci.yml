name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      # Submodules are not needed to validate the stack definition.
      - uses: actions/checkout@v5
      - name: Compose file is valid for every profile
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml \
            --profile aws-emulator --profile observability --profile platform config --quiet
      - name: Supporting services start and become healthy
        run: |
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180
          docker compose -f docker-compose.yml ps
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml down -v

  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every submodule points to the orkstage organization
        run: |
          if [ ! -f .gitmodules ]; then echo "no .gitmodules"; exit 0; fi
          bad=$(git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | awk '$2 !~ /^https:\/\/github\.com\/orkstage\//')
          if [ -n "$bad" ]; then echo "::error::unexpected submodule URLs:"; echo "$bad"; exit 1; fi
          git config -f .gitmodules --get-regexp '^submodule\..*\.url$'
