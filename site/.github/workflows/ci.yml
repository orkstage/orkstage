name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Content checks run when the scripts exist in package.json.
      - run: pnpm run --if-present check:prose
      - run: pnpm build
      - run: pnpm run --if-present check:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          if-no-files-found: error
          retention-days: 7
