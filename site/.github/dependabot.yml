version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      fumadocs:
        patterns: ['fumadocs-*']
      react-next:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # AWS provider of the hosting configuration.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
