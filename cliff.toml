# git-cliff configuration (https://git-cliff.org). CHANGELOG.md is generated from the Conventional
# Commit titles of the pull requests merged into main; edit this file, not the changelog. The
# Release workflow regenerates it for each version, and the same file writes the release notes.
# Locally: docker run --rm -v "$PWD:/app" -w /app orhunp/git-cliff:2.14.2 -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to orkstage, by release. Generated by
[git-cliff](https://git-cliff.org) from the titles of merged pull requests: see `cliff.toml`.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# Pull request numbers become links. Titles stay as written (lower case, like `ork init`).
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/orkstage/orkstage/pull/${1}))" },
]
# Groups, in this order (the HTML comments sort them and are removed). Everything else, such as
# ci, chore, build, test, style and refactor, stays out of the changelog.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
# Release candidates fold into the release they prepare.
ignore_tags = "-rc\\."
topo_order = false
sort_commits = "newest"
