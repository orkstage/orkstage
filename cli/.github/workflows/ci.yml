name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.99'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          CI: 'true' # insta fails on missing/changed snapshots instead of writing them

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: sh scripts/build-wasm.sh
      - name: The committed WebAssembly package is up to date
        run: git diff --exit-code -- dist/scan-wasm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Smoke test the npm package
        run: |
          node -e "const s=require('./dist/scan-wasm'); const r=s.scanFiles([{path:'docker-compose.yml',content:'services:\n  db:\n    image: postgres:17\n'}]); if(!r.resources.some(x=>x.id==='database')) process.exit(1); console.log(s.version())"

  build:
    needs: [lint, test]
    env:
      # Signing runs only on tags and only when the secrets exist (forks and PRs build unsigned).
      SIGN_WINDOWS: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' }}
      SIGN_MACOS: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p ork-cli --target ${{ matrix.target }}

      # Code signing. Unsigned binaries are blocked by application control on many Windows
      # machines and by Gatekeeper on macOS, so releases must be signed.
      # Windows: Authenticode, for example Azure Trusted Signing (the `azure/trusted-signing-action`
      # action) or signtool with an EV certificate; timestamp every signature.
      # macOS: codesign with a Developer ID Application certificate and the hardened runtime,
      # then notarize with `xcrun notarytool submit --wait` (zip the binary first).
      - name: Sign (Windows, Authenticode)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && env.SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p ci build.keychain
          BIN=target/${{ matrix.target }}/release/ork
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$BIN"
          ditto -c -k --keepParent "$BIN" ork.zip
          xcrun notarytool submit ork.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - uses: actions/upload-artifact@v4
        with:
          name: ork-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ork
            target/${{ matrix.target }}/release/ork.exe
          if-no-files-found: error
