version: 2
updates:
  # Rust workspace (Cargo.lock at the root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      wasm-bindgen:
        # Keep `wasm-bindgen` in step with `wasm-bindgen-cli` in `docker/` and the CI workflow.
        patterns: ['wasm-bindgen', 'js-sys', 'serde-wasm-bindgen']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Rust toolchain image used for builds in containers.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
