[workspace]
resolver = "3"
members = ["crates/orkstage-scan", "crates/orkstage-scan-wasm", "crates/ork-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/orkstage/orkstage-cli"
authors = ["OrkStage contributors"]

[workspace.dependencies]
orkstage-scan = { path = "crates/orkstage-scan", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
hcl-rs = "0.19.8"
yaml-rust2 = "0.13.0"
toml = "1.1.0"
regex = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# The wasm package is size sensitive; it inherits the release profile above.
[profile.bench]
debug = false
