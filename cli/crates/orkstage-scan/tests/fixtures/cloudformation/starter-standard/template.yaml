AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The platform's built-in "starter-standard" template, written as CloudFormation.
  Uses short-form intrinsic functions on purpose.

Parameters:
  ApiReplicas:
    Type: Number
    Default: 1
  ApiImage:
    Type: String
    Default: 123456789012.dkr.ecr.us-east-1.amazonaws.com/sample-api:1.4.0

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  Registry:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: starter/apps
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: '17.4'
      DBInstanceClass: db.t4g.small
      AllocatedStorage: '20'
      MultiAZ: false
      BackupRetentionPeriod: 7
      MasterUsername: app
      ManageMasterUserPassword: true

  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: API cache
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 1

  MessagingDlq:
    Type: AWS::SQS::Queue
  Messaging:
    Type: AWS::SQS::Queue
    Properties:
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MessagingDlq.Arn
        maxReceiveCount: 5

  Cluster:
    Type: AWS::ECS::Cluster
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: starter-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: REDIS_HOST
              Value: !GetAtt Cache.PrimaryEndPoint.Address
            - Name: QUEUE_URL
              Value: !Ref Messaging
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: starter-worker
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: worker
          Image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/sample-worker:1.4.0
          Environment:
            - Name: DATABASE_URL
              Value: !Sub 'postgres://app@${Database.Endpoint.Address}:5432/app'
            - Name: QUEUE_URL
              Value: !Ref Messaging
  Api:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTask
      DesiredCount: !Ref ApiReplicas
      LaunchType: FARGATE
      LoadBalancers:
        - TargetGroupArn: !Ref ApiTargetGroup
          ContainerName: api
          ContainerPort: 8080
  Worker:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTask
      DesiredCount: 1
      LaunchType: FARGATE

  Ingress:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /health
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: app.example.com
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Ingress
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  Dns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: example.com.
      Name: app.example.com.
      Type: A
      AliasTarget:
        DNSName: !GetAtt Ingress.DNSName
        HostedZoneId: !GetAtt Ingress.CanonicalHostedZoneID

  ApiLogs:
    Type: AWS::Logs::LogGroup
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
  Thumbnailer:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Code: { ZipFile: 'exports.handler = async () => {}' }
      Role: !GetAtt TaskRole.Arn

Outputs:
  Url:
    Value: !Sub 'https://${Ingress.DNSName}'
