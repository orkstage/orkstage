[package]
name = "orkstage-scan-wasm"
description = "WebAssembly bindings for the OrkStage scan engine (published as @orkstage/scan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
orkstage-scan.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6.5"

# wasm-bindgen generates unsafe glue code, so the workspace `unsafe_code = "forbid"` lint is
# relaxed here; this crate itself contains no unsafe blocks.
[lints.clippy]
all = { level = "warn", priority = -1 }
