name: CI

on:
  # Merges to main are not built again: the pull request was.
  pull_request:

# A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Secret scan of the whole history with gitleaks. Reviewed false positives go in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --verbose
      # Every source file has an SPDX license header; core code does not import ee/ (scripts/spdx.sh).
      - name: License headers and the ee/ boundary
        run: bash scripts/spdx.sh

  build-test:
    runs-on: ubuntu-latest
    # Images come from mirror.gcr.io (Google's Docker Hub cache): anonymous pulls from Docker Hub
    # on shared runners hit its rate limit.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations apply cleanly and seed is idempotent
        run: |
          pnpm db:deploy
          pnpm db:seed
          pnpm db:seed
      - name: Dependency audit
        run: pnpm audit --audit-level high
