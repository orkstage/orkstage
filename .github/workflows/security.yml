name: Security

on:
  # While the repositories are private, Actions minutes are paid: scan only when what is scanned
  # changes, or on demand. At launch (free minutes for public repositories) remove the paths
  # filter and add back a push trigger and a weekly schedule (cron '17 6 * * 1').
  pull_request:
    paths:
      - pnpm-lock.yaml
      - '**/package.json'
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Known vulnerabilities in the locked dependencies. Fails on critical ones that have a fix.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (lockfiles)
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.57.1 fs --quiet --scanners vuln
          --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs node_modules /src

  # Code scanning and the OpenSSF Scorecard report through GitHub Advanced Security, which private
  # repositories do not have here; these jobs start on their own once the repository is public.
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  scorecard:
    if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
